apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{.Name}}
spec:
  capacity:
    storage: {{.Size}}Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /var/mnt/{{.Name}}
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - {{.Hostname}}

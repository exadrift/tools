apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: {{.HelmRepo}}
      chart: argo-cd
      targetRevision: "{{.Version}}"
      helm:
        releaseName: argocd
        valueFiles:
          - $values/applications/infra/argocd/values.yaml

    - repoURL: {{.Repo}}
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true